<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  :root{--green:#74f58a;--lime:#9dff78;--black:#050705;--ink:#0d120f;--soft:#eef4ef;--muted:#89948c;--line:rgba(255,255,255,.12)}

  /* ===== NEXT-GEN FIELD ===== */

  .modal-brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}

  .modal-brand strong{font-weight:500;letter-spacing:-.03em;font-size:15px}.modal-brand small{color:#7d877f;font-size:10px;margin-left:4px}
  .modal-head h2{margin:0;font-size:30px;line-height:1.05;letter-spacing:-.055em;font-weight:500}.modal-head p{margin:9px 0 20px;color:#7c867f;font-size:12px}
  .switch{display:flex;gap:20px;border-bottom:1px solid #e3e7e3;margin-bottom:18px}
  .switch button{position:relative;border:0;background:none;padding:0 0 11px;color:#99a19b;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}

  .providers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.provider{height:50px;border:1px solid #dde4de;border-radius:14px;background:#fff;color:#111;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:9px;transition:.2s ease}.provider:hover{transform:translateY(-1px);border-color:#c4cec6;box-shadow:0 9px 20px rgba(8,14,10,.07)}.provider svg{width:16px;height:16px}
  .divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:#a2aaa4;font-size:9px;letter-spacing:.15em;text-transform:uppercase}.divider::before,.divider::after{content:"";height:1px;background:#e6ebe6;flex:1}
  .form-field{margin-bottom:13px}.label{display:block;margin-bottom:6px;color:#545d56;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.input{position:relative}.input input{width:100%;height:50px;border:1px solid #dfe6df;border-radius:13px;background:#fff;outline:none;padding:0 14px;color:#121713;font-size:13px}.input input:focus{border-color:#3bd469;box-shadow:0 0 0 4px rgba(59,212,105,.08)}.input input::placeholder{color:#a2aaa5}.show{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:#7a837d;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:7px}
  .row{display:flex;justify-content:space-between;align-items:center;margin:3px 0 15px;font-size:10px}.remember{display:flex;align-items:center;gap:7px;color:#7d867f}.remember input{width:14px;height:14px;accent-color:#1bc85a}.forgot{color:#202720;text-decoration:none;font-weight:600}
  .submit{position:relative;width:100%;height:52px;border:0;border-radius:14px;background:#0b100d;color:#fff;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 16px 30px rgba(9,14,10,.16);overflow:hidden}.submit::before{content:"";position:absolute;inset:-80% 25%;background:radial-gradient(circle,rgba(132,255,145,.27),transparent 55%);opacity:0;transition:.2s ease}.submit:hover::before{opacity:1}.submit span{position:relative}.note{margin-top:16px;text-align:center;color:#919a93;font-size:9px;letter-spacing:.02em}
  body.modal-open{overflow:hidden}


  /* ===== PREMIUM FUTURISTIC AUTH POPUP ===== */
  .tiny,.sub,.bottom{display:none}
  .modal{background:
    radial-gradient(circle at 50% 50%,rgba(109,255,132,.055),transparent 38%),

    backdrop-filter:blur(26px) saturate(.82);
    transition:opacity .34s ease,visibility .34s ease}
  .modal::before{content:"";position:absolute;inset:-18%;background:
    conic-gradient(from 120deg at 50% 50%,transparent 0 24%,rgba(126,255,149,.045) 30%,transparent 36%,rgba(255,255,255,.025) 48%,transparent 57%,rgba(126,255,149,.035) 70%,transparent 78%);
    filter:blur(30px);animation:modalAura 18s linear infinite;pointer-events:none}

  .modal-card{position:relative;width:min(470px,calc(100vw - 28px));max-height:min(760px,calc(100dvh - 28px));overflow:auto;border:1px solid rgba(255,255,255,.74);border-radius:30px;
    background:
      linear-gradient(180deg,rgba(255,255,255,.985),rgba(247,250,248,.975)),

    transition:transform .56s cubic-bezier(.16,1,.3,1),opacity .34s ease,filter .56s ease}

<body>
<div class="page" id="page">
  <div class="field-bg" id="field">
    <div class="rings" aria-hidden="true"><span class="r1"></span><span class="r2"></span><span class="r3"></span></div>
    <canvas id="fieldCanvas" aria-hidden="true"></canvas>
    <div class="spotlight" id="spotlight"></div>
    <div class="grain" aria-hidden="true"></div>
  </div>

  <div class="content">
    <header class="top">
      <a class="brand" href="#" aria-label="AskMoina home">
        <span class="logo" aria-hidden="true"><i class="o o1"></i><i class="o o2"></i><i class="o o3"></i><i class="core"></i></span>
        <span class="wordmark">AskMoina</span>
      </a>
      <div class="live"><i></i> LIVE</div>
    </header>

    <main class="stage">
      <div class="hero">
        <h1><span class="typed" id="typed"></span><span class="cursor" aria-hidden="true"></span></h1>
        <button class="cta" type="button" onclick="openAuth('signup')">GET STARTED</button>
      </div>
    </main>

  </div>

  <div class="modal" id="authModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="authTitle">

      <div class="modal-topline"></div>
      <button class="close" type="button" onclick="closeAuth()" aria-label="Close">×</button>
      <div class="modal-inner">
        <div class="modal-head">
          <div class="modal-status"><i aria-hidden="true"></i><span>LIVE</span></div>
          <h2 id="authTitle">Enter AskMoina.</h2>
        </div>
        <div class="switch"><button id="loginTab" class="active" onclick="setMode('login')">Log in</button><button id="signupTab" onclick="setMode('signup')">Create account</button></div>
        <div class="providers">
          <button class="provider" type="button" onclick="demo('Google')"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.35 12.27c0-.79-.07-1.55-.2-2.27H12v4.3h5.24a4.49 4.49 0 0 1-1.94 2.95v2.46h3.15c1.84-1.7 2.9-4.2 2.9-7.44z"/><path fill="#34A853" d="M12 21.88c2.63 0 4.84-.87 6.45-2.37l-3.15-2.46c-.88.59-2 .94-3.3.94-2.54 0-4.69-1.72-5.46-4.03H3.3v2.54A9.74 9.74 0 0 0 12 21.88z"/><path fill="#FBBC05" d="M6.54 13.96A5.86 5.86 0 0 1 6.23 12c0-.68.12-1.34.31-1.96V7.5H3.3A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.05 1.05 4.5l3.24-2.54z"/><path fill="#EA4335" d="M12 5.98c1.43 0 2.71.49 3.72 1.46l2.79-2.79C16.84 3.03 14.63 2.12 12 2.12A9.74 9.74 0 0 0 3.3 7.5l3.24 2.54C7.31 7.7 9.46 5.98 12 5.98z"/></svg>Google</button>
          <button class="provider" type="button" onclick="demo('GitHub')"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#111" d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.69-.22.69-.49v-1.72c-2.8.61-3.39-1.18-3.39-1.18-.46-1.16-1.12-1.47-1.12-1.47-.92-.63.07-.62.07-.62 1.02.07 1.56 1.05 1.56 1.05.91 1.55 2.39 1.1 2.97.84.09-.66.36-1.1.65-1.35-2.24-.25-4.6-1.12-4.6-4.98 0-1.1.39-2 1.04-2.71-.1-.25-.45-1.28.1-2.67 0 0 .85-.27 2.75 1.04A9.54 9.54 0 0 1 12 6.71c.85 0 1.71.12 2.52.36 1.9-1.31 2.75-1.04 2.75-1.04.55 1.39.2 2.42.1 2.67.65.71.69 1.88.69 1.88.37.32.69.93.69 1.88V21c0 .27.19.59.69.49A10 10 0 0 0 12 2z"/></svg>GitHub</button>
        </div>
        <div class="divider"><span>or use email</span></div>
        <div class="auth-message" id="authMessage" role="status" aria-live="polite"></div>
        <form onsubmit="return submitForm(event)" autocomplete="on">
          <div class="form-field signup-only"><label class="label" for="name">Full name</label><div class="input"><input id="name" placeholder="Your name" autocomplete="name"></div></div>
          <div class="form-field"><label class="label" for="email">Email</label><div class="input"><input id="email" type="email" placeholder="you@example.com" autocomplete="email" required></div></div>
          <div class="form-field"><label class="label" for="password">Password</label><div class="input"><input id="password" type="password" placeholder="Your password" autocomplete="current-password" required><button class="show" type="button" onclick="togglePassword()">Show</button></div></div>
          <div class="form-field signup-only"><label class="label" for="confirm">Confirm password</label><div class="input"><input id="confirm" type="password" placeholder="Repeat password" autocomplete="new-password"></div></div>
          <div class="row"><label class="remember"><input type="checkbox"> Remember me</label><a class="forgot" href="#" onclick="return false">Forgot password?</a></div>
          <button class="submit" id="submitBtn" type="submit"><span>Continue</span></button>
        </form>
        <div class="note">Protected by AskMoina.</div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  const modal = document.getElementById('authModal');
  const typed = document.getElementById('typed');
  const title = document.getElementById('authTitle');
  const loginTab = document.getElementById('loginTab');
  const signupTab = document.getElementById('signupTab');
  const card = document.querySelector('.modal-card');
  let mode='login',timer=0,index=0,lastFocus=null;
  const lines=[
    'One prompt, many minds.',
    'Answers change as you ask.',
    'It remembers the whole story.',
    'Ideas connect in new ways.',
    'Complex things become clear.',
    'More is happening underneath.',
    'It keeps up with you.',
    'Your best ideas grow here.',
    'Questions can go much further.',
    'There is more to discover.'
  ];
  function typeLine(){
    clearTimeout(timer);const line=lines[index];let i=0;typed.textContent='';
    const step=()=>{if(i<line.length){typed.textContent=line.slice(0,++i);timer=setTimeout(step,68)}else timer=setTimeout(deleteLine,2300)};step();
  }
  function deleteLine(){
    clearTimeout(timer);let i=typed.textContent.length;
    const step=()=>{if(i>0){typed.textContent=typed.textContent.slice(0,--i);timer=setTimeout(step,38)}else{index=(index+1)%lines.length;timer=setTimeout(typeLine,420)}};step();
  }
  window.openAuth=(next='signup')=>{lastFocus=document.activeElement;setMode(next,false);modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.body.classList.add('modal-open');requestAnimationFrame(()=>{card.scrollTop=0;document.querySelector(next==='signup'?'#name':'#email')?.focus()})};
  window.closeAuth=()=>{modal.classList.remove('open');modal.setAttribute('aria-hidden','true');document.body.classList.remove('modal-open');lastFocus?.focus?.()};
  modal.addEventListener('click',e=>{if(e.target===modal)closeAuth()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))closeAuth()});
  window.togglePassword=()=>{const p=document.getElementById('password');const b=document.querySelector('.show');const show=p.type==='password';p.type=show?'text':'password';b.textContent=show?'Hide':'Show'};

  const SUPABASE_URL='https://dzhfvyguulwxahsdchke.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY='sb_publishable_XjC-v4L2JU6YIhD2hXb6Cw_3BedZ1qs';
  const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{
    auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}
  });
  const authMessage=document.getElementById('authMessage');
  const submitButton=document.getElementById('submitBtn');
  const authPageUrl=window.location.origin+window.location.pathname;

  function setAuthMessage(message,type=''){
    authMessage.textContent=message||'';
    authMessage.className='auth-message'+(message?' show':'')+(type?' '+type:'');
  }

  function setSubmitting(value){
    submitButton.classList.toggle('loading',value);
    submitButton.disabled=value;
    submitButton.querySelector('span').textContent=value
      ? (mode==='login'?'Signing in…':'Creating account…')
      : (mode==='login'?'Continue':'Create account');
  }

  function friendlyAuthError(error){
    const message=String(error?.message||'Authentication failed.');
    if(/invalid login credentials/i.test(message)) return 'The email or password is incorrect.';
    if(/email not confirmed/i.test(message)) return 'Please confirm your email address before signing in.';
    if(/password/i.test(message)&&/short|characters|length/i.test(message)) return 'Please use a stronger password.';
    if(/too many requests|rate limit/i.test(message)) return 'Too many attempts. Please wait a moment and try again.';
    return message;
  }

  window.setMode=(next,focus=true)=>{
    mode=next;
    document.querySelector('.modal-card').classList.toggle('auth-signup',mode==='signup');
    loginTab.classList.toggle('active',mode==='login');
    signupTab.classList.toggle('active',mode==='signup');
    title.textContent=mode==='login'?'Enter AskMoina.':'Create AskMoina.';
    document.getElementById('submitBtn').querySelector('span').textContent=mode==='login'?'Continue':'Create account';
    document.getElementById('password').setAttribute('autocomplete',mode==='login'?'current-password':'new-password');
    document.getElementById('name').required=mode==='signup';
    document.getElementById('confirm').required=mode==='signup';
    document.querySelector('.forgot').style.visibility=mode==='login'?'visible':'hidden';
    setAuthMessage('');
    if(focus)requestAnimationFrame(()=>document.querySelector(mode==='signup'?'#name':'#email')?.focus());
  };

  async function handleOAuth(provider){
    setAuthMessage('');
    try{
      const {error}=await supabaseClient.auth.signInWithOAuth({
        provider,
        options:{redirectTo:authPageUrl}
      });
      if(error) setAuthMessage(friendlyAuthError(error),'error');
    }catch(error){
      setAuthMessage(friendlyAuthError(error),'error');
    }
  }

  window.demo=provider=>handleOAuth(String(provider||'').toLowerCase());

  window.submitForm=async e=>{
    e.preventDefault();
    setAuthMessage('');

    const email=document.getElementById('email').value.trim();
    const password=document.getElementById('password').value;
    const name=document.getElementById('name').value.trim();
    const confirm=document.getElementById('confirm').value;

    if(mode==='signup'){
      if(!name){
        setAuthMessage('Please enter your full name.','error');
        return false;
      }

      if(password!==confirm){
        setAuthMessage('Passwords do not match.','error');
        return false;
      }

      if(password.length<8){
        setAuthMessage('Please use at least 8 characters for your password.','error');
        return false;
      }
    }

    if(!email||!password){
      setAuthMessage('Please complete the required fields.','error');
      return false;
    }

    setSubmitting(true);

    try{
      if(mode==='signup'){
        const {data,error}=await supabaseClient.auth.signUp({
          email,
          password,
          options:{
            data:{full_name:name},
            emailRedirectTo:authPageUrl
          }
        });

        if(error) throw error;

        if(data.session){
          window.location.href='/app.html';
        }else{
          setAuthMessage(
            'Account created. Check your email to confirm your address, then return here to sign in.',
            'success'
          );
        }

      }else{
        const {data,error}=await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

        if(error) throw error;

        if(data.session){
          window.location.href='/app.html';
        }
      }

    }catch(error){
      setAuthMessage(friendlyAuthError(error),'error');

    }finally{
      setSubmitting(false);
    }

    return false;
  };

  document.querySelector('.forgot')?.addEventListener('click',async e=>{
    e.preventDefault();
    const email=document.getElementById('email').value.trim();
    if(!email){
      setAuthMessage('Enter your email address first, then choose Forgot password.','error');
      return;
    }
    setSubmitting(true);
    try{
      const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:authPageUrl});
      if(error) throw error;
      setAuthMessage('If an account exists for that email, a password reset link has been sent.','success');
    }catch(error){
      setAuthMessage(friendlyAuthError(error),'error');
    }finally{
      setSubmitting(false);
    }
  });

  supabaseClient.auth.onAuthStateChange((event,session)=>{
    if (event === 'SIGNED_IN' && session) {
      window.location.href = '/app.html';
    
    }else if(event==='SIGNED_OUT'){
      setAuthMessage('Signed out.','success');
    }
  });

  (async()=>{
    try{
      const {data}=await supabaseClient.auth.getSession();
      if(data.session){
        window.location.href='/app.html';
      }
    }catch(error){
      console.error('AskMoina auth initialization failed',error);
    }
  })();
  typeLine();

  const canvas=document.getElementById('fieldCanvas'),ctx=canvas.getContext('2d'),field=document.getElementById('field'),spot=document.getElementById('spotlight');
  let w=0,h=0,dpr=1,t=0,particles=[],streams=[];
  const mouse={x:-9999,y:-9999};
  function resize(){dpr=Math.min(window.devicePixelRatio||1,2);w=canvas.clientWidth;h=canvas.clientHeight;canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);const n=Math.min(46,Math.max(24,Math.floor(w*h/52000)));particles=Array.from({length:n},()=>({u:Math.random(),v:Math.random(),s:.00025+Math.random()*.00045,r:.8+Math.random()*1.1,a:.1+Math.random()*.35}));streams=Array.from({length:8},(_,i)=>({phase:Math.random()*Math.PI*2,amp:h*(.08+Math.random()*.11),speed:.00024+Math.random()*.0002,y:h*(.18+i*.09)}))}
  function curveY(s,x,time){const q=x/w;return s.y + Math.sin(q*7.2+time*s.speed*10000+s.phase)*s.amp + Math.sin(q*15.5-time*s.speed*7600+s.phase*1.7)*s.amp*.23}
  function draw(){t++;ctx.clearRect(0,0,w,h);
    ctx.globalCompositeOperation='lighter';
    for(const s of streams){ctx.beginPath();for(let x=-20;x<=w+20;x+=8){const y=curveY(s,x,t);x===-20?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.strokeStyle='rgba(120,255,145,.055)';ctx.lineWidth=1.1;ctx.stroke();
      const hx=((t*s.speed*140+w*(1+s.phase/6))%(w+220))-110,hy=curveY(s,hx,t);const g=ctx.createRadialGradient(hx,hy,0,hx,hy,45);g.addColorStop(0,'rgba(190,255,188,.7)');g.addColorStop(.25,'rgba(120,255,145,.2)');g.addColorStop(1,'rgba(120,255,145,0)');ctx.fillStyle=g;ctx.fillRect(hx-46,hy-46,92,92);
    }
    for(const p of particles){p.u=(p.u+p.s)%1;const x=w*(.1+p.u*.8),y=h*(.16+p.v*.68)+Math.sin(p.u*9+t*.003+p.v*8)*10;const near=Math.hypot(x-mouse.x,y-mouse.y);const a=p.a+(near<170?.35:0);ctx.beginPath();ctx.arc(x,y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(193,255,194,${a})`;ctx.fill()}
    ctx.globalCompositeOperation='source-over';requestAnimationFrame(draw)
  }
  field.addEventListener('pointermove',e=>{const r=field.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;spot.style.setProperty('--mx',mouse.x+'px');spot.style.setProperty('--my',mouse.y+'px')});
  field.addEventListener('pointerleave',()=>{mouse.x=-9999;mouse.y=-9999});
  window.addEventListener('resize',resize);resize();draw();
})();
</script>
</body>
